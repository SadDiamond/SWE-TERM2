<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
  <rect width="1500" height="1020" fill="#f7f9fc"/>
  <defs>
    <marker id="assoc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5f748b"/></marker>
    <marker id="inherit" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M1 7 L12 1 L12 13 Z" fill="#fff" stroke="#5f748b" stroke-width="2"/></marker>
  </defs>
  <style>
    .class{fill:#fff;stroke:#2e74b5;stroke-width:3}.abstract{fill:#e8f1f8;stroke:#2e74b5;stroke-width:3}.interface{fill:#fff3d8;stroke:#c9932e;stroke-width:3}
    .sep{stroke:#5f748b;stroke-width:2}.rel{fill:none;stroke:#5f748b;stroke-width:3}.realize{fill:none;stroke:#5f748b;stroke-width:3;stroke-dasharray:10 8}
    .title{font:700 23px Calibri,Arial,sans-serif;fill:#1f2933}.body{font:18px Calibri,Arial,sans-serif;fill:#405364}.label{font:16px Calibri,Arial,sans-serif;fill:#405364}
  </style>

  <rect x="55" y="60" width="350" height="155" class="abstract"/><line x1="55" y1="105" x2="405" y2="105" class="sep"/><line x1="55" y1="157" x2="405" y2="157" class="sep"/>
  <text x="230" y="91" text-anchor="middle" class="title">Interactable «abstract»</text><text x="80" y="137" class="body"># promptMessage : string</text><text x="80" y="190" class="body">+ OnInteract(player) : void</text>

  <rect x="500" y="45" width="330" height="185" class="class"/><line x1="500" y1="90" x2="830" y2="90" class="sep"/><line x1="500" y1="165" x2="830" y2="165" class="sep"/>
  <text x="665" y="76" text-anchor="middle" class="title">PlayerController</text><text x="525" y="120" class="body">- momentum : Vector3</text><text x="525" y="145" class="body">- dashCharges : int</text><text x="525" y="197" class="body">+ TakeDamage(amount)</text><text x="525" y="220" class="body">+ Move() / Grapple()</text>

  <rect x="955" y="45" width="350" height="200" class="class"/><line x1="955" y1="90" x2="1305" y2="90" class="sep"/><line x1="955" y1="165" x2="1305" y2="165" class="sep"/>
  <text x="1130" y="76" text-anchor="middle" class="title">BasicEnemyAI</text><text x="980" y="120" class="body">- health : float</text><text x="980" y="145" class="body">- agent : NavMeshAgent</text><text x="980" y="197" class="body">+ TakeDamage(amount)</text><text x="980" y="220" class="body">+ ApplyGrapplePull(...)</text>

  <rect x="40" y="375" width="270" height="130" class="class"/><line x1="40" y1="420" x2="310" y2="420" class="sep"/>
  <text x="175" y="406" text-anchor="middle" class="title">Terminal</text><text x="65" y="452" class="body">+ isSolved : bool</text><text x="65" y="482" class="body">+ Complete() : void</text>
  <rect x="330" y="375" width="290" height="130" class="class"/><line x1="330" y1="420" x2="620" y2="420" class="sep"/>
  <text x="475" y="406" text-anchor="middle" class="title">CybergrindShopStation</text><text x="355" y="452" class="body">- price : int</text><text x="355" y="482" class="body">+ OnInteract(player)</text>

  <rect x="690" y="375" width="300" height="155" class="class"/><line x1="690" y1="420" x2="990" y2="420" class="sep"/><line x1="690" y1="475" x2="990" y2="475" class="sep"/>
  <text x="840" y="406" text-anchor="middle" class="title">Gun</text><text x="715" y="452" class="body">- activePresetIndex : int</text><text x="715" y="507" class="body">+ Fire() / AltFire()</text>

  <rect x="1060" y="365" width="360" height="180" class="class"/><line x1="1060" y1="410" x2="1420" y2="410" class="sep"/><line x1="1060" y1="485" x2="1420" y2="485" class="sep"/>
  <text x="1240" y="396" text-anchor="middle" class="title">CybergrindArenaDirector</text><text x="1085" y="440" class="body">- floor : int</text><text x="1085" y="465" class="body">- generator : ArenaGenerator</text><text x="1085" y="517" class="body">+ AdvanceFloor() : void</text>

  <rect x="990" y="665" width="360" height="155" class="class"/><line x1="990" y1="710" x2="1350" y2="710" class="sep"/><line x1="990" y1="765" x2="1350" y2="765" class="sep"/>
  <text x="1170" y="696" text-anchor="middle" class="title">CybergrindArenaGenerator</text><text x="1015" y="742" class="body">- arenaMode : enum</text><text x="1015" y="797" class="body">+ GenerateArena() : void</text>

  <rect x="275" y="725" width="300" height="135" class="interface"/><line x1="275" y1="770" x2="575" y2="770" class="sep"/>
  <text x="425" y="756" text-anchor="middle" class="title">IDamageable «interface»</text><text x="300" y="812" class="body">+ TakeDamage(amount)</text>
  <rect x="610" y="725" width="340" height="160" class="interface"/><line x1="610" y1="770" x2="950" y2="770" class="sep"/>
  <text x="780" y="756" text-anchor="middle" class="title">IGrappleMassTarget «interface»</text><text x="635" y="812" class="body">+ GrappleMassClass</text><text x="635" y="840" class="body">+ ApplyGrapplePull(...)</text>

  <path d="M175 375 V300 H230 V215" class="rel" marker-end="url(#inherit)"/><path d="M475 375 V300 H230 V215" class="rel" marker-end="url(#inherit)"/>
  <path d="M665 230 V315 H840 V375" class="rel" marker-end="url(#assoc)"/><text x="690" y="302" class="label">uses</text>
  <path d="M840 530 V610 H425 V725" class="realize" marker-end="url(#inherit)"/><text x="590" y="595" class="label">damages through</text>
  <path d="M665 230 V650 H425 V725" class="realize" marker-end="url(#inherit)"/><path d="M1130 245 V620 H425 V725" class="realize" marker-end="url(#inherit)"/>
  <path d="M1130 245 V640 H780 V725" class="realize" marker-end="url(#inherit)"/>
  <path d="M1240 545 V665" class="rel" marker-end="url(#assoc)"/><text x="1255" y="615" class="label">controls</text>
  <path d="M1060 440 H990" class="rel" marker-end="url(#assoc)"/><text x="1002" y="425" class="label">checks</text>
  <path d="M1060 470 C890 590 430 590 175 505" class="rel" marker-end="url(#assoc)"/><text x="670" y="585" class="label">reads solved state</text>

  <!-- Explicit UML arrowheads retained by Word-compatible SVG conversion. -->
  <g fill="#fff" stroke="#5f748b" stroke-width="3">
    <polygon points="230,215 216,237 244,237"/><polygon points="230,215 216,237 244,237"/>
    <polygon points="425,725 411,703 439,703"/><polygon points="780,725 766,703 794,703"/>
  </g>
  <g fill="#5f748b">
    <polygon points="840,375 831,358 849,358"/><polygon points="1240,665 1231,648 1249,648"/>
    <polygon points="990,440 1007,431 1007,449"/><polygon points="175,505 161,522 187,525"/>
  </g>

  <rect x="55" y="920" width="1390" height="65" fill="#eef3f7" stroke="#c8d3de" stroke-width="2" rx="8"/>
  <text x="85" y="960" class="body">Solid triangle: inheritance</text><text x="410" y="960" class="body">Dashed triangle: interface implementation</text><text x="900" y="960" class="body">Arrow: association / dependency</text>
</svg>
